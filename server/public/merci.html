<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06050d">
<title>Merci - InfinityLive</title>
<link rel="stylesheet" href="/css/infinity.css">
<style>
body{ display:flex; justify-content:center; align-items:center; padding:22px; text-align:center; }
.container{ width:100%; max-width:620px; }
.card{ padding:34px 28px; }
.logo{ width:210px; max-width:70%; margin-bottom:10px; animation:float 5s ease-in-out infinite; }
h1{ margin:6px 0 10px; font-size:34px; font-weight:800; line-height:1.15; letter-spacing:-.01em; }
p{ margin:0; font-size:18px; color:var(--muted); line-height:1.45; }
.qr-container{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; margin-top:30px; }
.qr{
    width:140px;
    height:140px;
    padding:10px;
    border-radius:18px;
    background:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.qr img{ width:100%; height:100%; object-fit:contain; display:block; }
.label{ margin-top:10px; font-size:15px; font-weight:800; letter-spacing:.5px; }
.again{
    display:inline-block;
    margin-top:30px;
    padding:15px 28px;
    border-radius:14px;
    font-size:17px;
    font-weight:800;
    text-decoration:none;
    color:#07060f;
    background:var(--grad);
    box-shadow:0 10px 30px rgba(155,123,240,.35);
}
@media(max-width:600px){ h1{ font-size:28px; } .qr{ width:118px; height:118px; } }
</style>
</head>
<body>

<div class="container">
<div class="card">

<img class="logo" src="/images/logo.png?v=4" alt="InfinityLive">

<h1><span class="grad-text">Infinity</span> te remercie de ton passage !</h1>
<p>Suis-nous sur nos réseaux sociaux pour ne rien manquer.</p>

<div class="qr-container">
    <div>
        <div class="qr"><img src="/images/qr-instagram.png" alt="Instagram"></div>
        <div class="label">Instagram</div>
    </div>
    <div>
        <div class="qr"><img src="/images/qr-tiktok.png" alt="TikTok"></div>
        <div class="label">TikTok</div>
    </div>
    <div>
        <div class="qr"><img src="/images/qr-facebook.png" alt="Facebook"></div>
        <div class="label">Facebook</div>
    </div>
</div>

<a class="again" href="/">Repasser sur l'écran</a>

</div>
</div>

</body>
</html>
