<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive</title>


<style>


*{

    box-sizing:border-box;

}



body{


    margin:0;


    min-height:100vh;


    background:

    radial-gradient(

        circle at top,

        #bb07d3,

        #120012 70%

    );


    color:white;


    font-family:

    Arial,

    sans-serif;



    display:flex;


    justify-content:center;


    align-items:center;



    padding:20px;



}






body::before{


    content:"";


    position:fixed;


    inset:0;



    background:

    radial-gradient(

        circle,

        rgba(255,255,255,.12),

        transparent 50%

    );



    pointer-events:none;



}






.container{


    width:100%;


    max-width:430px;


    text-align:center;



}






.logo{


    width:220px;


    max-width:80%;


    margin-bottom:15px;



    filter:


    drop-shadow(

        0 0 20px rgba(255,255,255,.5)

    );


}






.card{


    background:

    rgba(0,0,0,.75);



    backdrop-filter:

    blur(15px);



    border-radius:30px;



    padding:30px;



    border:

    1px solid rgba(255,255,255,.15);



    box-shadow:


    0 20px 50px rgba(0,0,0,.5);



}







h1{


    margin-top:0;


    font-size:32px;


    letter-spacing:1px;



}







p{


    opacity:.8;


    font-size:18px;



}






input{


    width:100%;


    padding:16px;


    border-radius:15px;


    border:none;



    font-size:18px;



    margin-top:20px;



    outline:none;



}






input:focus{


    box-shadow:

    0 0 15px #bb07d3;



}






button{


    width:100%;


    margin-top:20px;



    padding:17px;



    border-radius:15px;



    border:none;



    font-size:21px;



    font-weight:bold;



    cursor:pointer;



    background:


    linear-gradient(

        135deg,

        white,

        #ddd

    );



    color:#111;



    transition:.3s;



}






button:hover{


    transform:scale(1.03);



    box-shadow:

    0 0 25px rgba(255,255,255,.5);



}

#leave{


    display:none;


    background:

    linear-gradient(

        135deg,

        #ff4b4b,

        #990000

    );


    color:white;


}




#status{


    margin-top:25px;



    font-size:20px;


    font-weight:bold;



}
#position{


    margin-top:15px;


    font-size:24px;


    font-weight:bold;



    color:#ffffff;



    text-shadow:


    0 0 10px #bb07d3;



}







video{


    width:100%;


    margin-top:30px;


    border-radius:25px;



    background:black;



    display:none;



    box-shadow:


    0 0 30px rgba(187,7,211,.6);



}







@media(max-width:600px){


    .card{


        padding:22px;


    }



    h1{


        font-size:26px;


    }



    .logo{


        width:200px;


    }



}



</style>


</head>


<body>





<div class="container">





<div class="card">



<img

class="logo"

src="/images/logo.png"

alt="InfinityLive">






<h1 id="welcomeTitle">

Bienvenue

</h1>







<p id="welcomeText">

Entrez votre prénom pour participer

</p>







<input

id="name"

placeholder="Votre prénom">







<button id="join">

Participer

</button>

<button id="leave">

Quitter la file

</button>





<div id="status"></div>



<div id="position"></div>







<video

id="camera"

autoplay

playsinline>

</video>





</div>





<script src="/socket.io/socket.io.js"></script>



<script>
    const socket = io();



const button =
document.getElementById("join");

const leaveButton =
document.getElementById("leave");

const nameInput =
document.getElementById("name");


const status =
document.getElementById("status");


const position =
document.getElementById("position");


const video =
document.getElementById("camera");



let joined = false;


let cameraStream = null;


let peerConnection = null;





const rtcConfiguration = {

    iceServers:[

        {
            urls:
            "stun:stun.l.google.com:19302"
        }

    ]

};








// ----------------------
// POSITION FILE
// ----------------------


socket.on(
"queuePosition",
(pos)=>{


    if(joined){


        position.innerText =
        "Position dans la file : " + pos;


    }


});









// ----------------------
// TON TOUR
// ----------------------


socket.on(
"visitorCalled",
async()=>{


    console.log(
        "🎥 Début envoi caméra"
    );


    status.innerText =
    "🎉 C'est votre tour !";



    position.innerText = "";



    if(!cameraStream){


        console.log(
            "Aucun flux caméra"
        );


        return;


    }







    if(peerConnection){


        peerConnection.close();


        peerConnection = null;


    }



    peerConnection =
    new RTCPeerConnection(
        rtcConfiguration
    );







    cameraStream
    .getTracks()
    .forEach(track=>{


        peerConnection.addTrack(
            track,
            cameraStream
        );


    });






    peerConnection.onicecandidate =
    (event)=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };






    const offer =
    await peerConnection.createOffer();





    await peerConnection.setLocalDescription(
        offer
    );






    socket.emit(
        "offer",
        offer
    );



    console.log(
        "📤 OFFER envoyée au serveur"
    );



});











// ----------------------
// RECEPTION ANSWER
// ----------------------


socket.on(
"answer",
async(answer)=>{


    if(peerConnection){


        await peerConnection.setRemoteDescription(
            answer
        );


        console.log(
            "📥 ANSWER reçue"
        );


    }


});











// ----------------------
// RECEPTION ICE
// ----------------------


socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        try{


            await peerConnection.addIceCandidate(
                candidate
            );


            console.log(
                "🧊 ICE ajouté"
            );


        }
        catch(error){


            console.error(
                "Erreur ICE :",
                error
            );


        }


    }


});

// ----------------------
// FIN DU PASSAGE
// ----------------------

socket.on(
"visitorFinished",
()=>{


    console.log(
        "✅ Passage terminé"
    );


    window.location.href =
    "/merci";


});










// ----------------------
// BOUTON PARTICIPER
// ----------------------


button.onclick =
async()=>{


    const name =
    nameInput.value.trim();






    if(!name){


        alert(
            "Veuillez entrer votre prénom"
        );


        return;


    }







    try{



        cameraStream =
await navigator.mediaDevices.getUserMedia({

    video:{

        facingMode:"user",

        width:{
            ideal:1920
        },

        height:{
            ideal:1080
        },

        frameRate:{
            ideal:30,
            max:60
        },

        aspectRatio:{
            ideal:16/9
        }


    },

    audio:false

});



const videoTrack =
cameraStream.getVideoTracks()[0];



const capabilities =
videoTrack.getCapabilities();



if(capabilities.width){


    await videoTrack.applyConstraints({

        width:{
            ideal:1920
        },

        height:{
            ideal:1080
        }

    });


}







        console.log(
            "📷 Caméra activée"
        );







        socket.emit(
            "visitorReady"
        );








        socket.emit(
            "joinQueue",
            name
        );







        joined = true;






        button.style.display =
        "none";



        nameInput.style.display =
        "none";

       leaveButton.style.display =
       "block";

document.getElementById("welcomeTitle").style.display = "none";

document.getElementById("welcomeText").style.display = "none";



        status.innerText =
        "✅ Vous êtes dans la file d'attente";



    }


    catch(error){


        console.error(
            error
        );


        status.innerText =
        "Autorisation caméra refusée";


    }


};

// ----------------------
// QUITTER LA FILE
// ----------------------

leaveButton.onclick =
()=>{


    socket.emit(
        "leaveQueue"
    );



    if(cameraStream){


        cameraStream
        .getTracks()
        .forEach(track=>{


            track.stop();


        });


        cameraStream = null;


    }



    if(peerConnection){


        peerConnection.close();


        peerConnection = null;


    }



    joined = false;



    button.style.display =
    "block";



    nameInput.style.display =
    "block";



    nameInput.value =
    "";



    leaveButton.style.display =
    "none";



    position.innerText =
    "";



    status.innerText =
    "Vous avez quitté la file";



};


</script>


</body>

</html>
