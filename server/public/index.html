<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const button =
document.getElementById("join");


const nameInput =
document.getElementById("name");


const status =
document.getElementById("status");


const position =
document.getElementById("position");


const video =
document.getElementById("camera");



let joined = false;


let cameraStream = null;


let peerConnection = null;



const rtcConfiguration = {

    iceServers:[

        {
            urls:
            "stun:stun.l.google.com:19302"
        }

    ]

};







// ----------------------
// FILE D'ATTENTE
// ----------------------


socket.on(
"queuePosition",
(pos)=>{


    if(joined){


        position.innerText =
        "Position dans la file : " + pos;


    }


});








// ----------------------
// SON TOUR
// ----------------------


socket.on(
"visitorCalled",
async()=>{


    console.log(
        "🎥 Création caméra WebRTC"
    );



    status.innerText =
    "🎉 C'est votre tour !";



    position.innerText = "";



    if(!cameraStream){

        console.log(
            "Pas de caméra disponible"
        );

        return;

    }






    // Nettoyage ancienne connexion

    if(peerConnection){

        peerConnection.close();

        peerConnection = null;

    }






    peerConnection =
    new RTCPeerConnection(
        rtcConfiguration
    );





    cameraStream
    .getTracks()
    .forEach(track=>{


        peerConnection.addTrack(
            track,
            cameraStream
        );


    });





    peerConnection.onicecandidate =
    (event)=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };
