<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:#111;

    color:white;

    font-family:Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}



.container{

    width:100%;

    max-width:420px;

    text-align:center;

}



.card{

    background:#000;

    border-radius:20px;

    padding:25px;

    box-shadow:0 0 20px rgba(255,255,255,0.1);

}



h1{

    font-size:35px;

}



input{

    width:100%;

    padding:15px;

    font-size:18px;

    border-radius:10px;

    border:none;

    margin-top:15px;

}



button{

    width:100%;

    padding:15px;

    margin-top:15px;

    font-size:20px;

    border-radius:10px;

    border:none;

    cursor:pointer;

}



#status{

    margin-top:20px;

    font-size:20px;

}



#position{

    margin-top:10px;

    font-size:22px;

    font-weight:bold;

}





video{

    margin-top:25px;

    width:100%;

    border-radius:20px;

    background:black;

}



</style>


</head>


<body>



<div class="container">



<div class="card">


<h1>
InfinityLive
</h1>


<p>
Entrez votre prénom pour participer
</p>



<input 
id="name"
placeholder="Votre prénom"
/>



<button id="join">

Participer

</button>




<div id="status"></div>


<div id="position"></div>



</div>





<video 
id="camera"
autoplay
playsinline>
</video>





</div>






<script src="/socket.io/socket.io.js"></script>



<script>



const socket = io();



const button =
document.getElementById("join");


const nameInput =
document.getElementById("name");


const status =
document.getElementById("status");


const position =
document.getElementById("position");


const video =
document.getElementById("camera");



let myId = null;

let joined = false;





socket.on(
"connect",
()=>{

    myId = socket.id;

}

);






socket.on(
"queueUpdated",
(queue)=>{


    if(!joined)
        return;



    const index =
    queue.findIndex(
        user=>user.id===myId
    );



    if(index !== -1){


        position.innerText =
        "Position dans la file : "
        +(index+1);


    }

    else{


        position.innerText =
        "Votre passage arrive";


    }



});







socket.on(
"visitorCalled",
()=>{


    status.innerText =
    "🎉 C'est votre tour !";


    position.innerText="";


});







button.onclick = async()=>{


    const name =
    nameInput.value.trim();



    if(!name){

        alert(
            "Veuillez entrer votre prénom"
        );

        return;

    }




    try{


        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                },

                frameRate:{
                    ideal:30
                },

                facingMode:"user"

            },

            audio:false

        });





        video.srcObject =
        stream;




        socket.emit(
            "joinQueue",
            name
        );



        socket.emit(
            "visitorReady"
        );




        joined=true;



        button.style.display =
        "none";



        nameInput.style.display =
        "none";





        status.innerText =
        "✅ Vous êtes dans la file d'attente";



    }


    catch(error){


        console.error(error);


        status.innerText =
        "Impossible d'activer la caméra";


    }


};





</script>



</body>

</html>
