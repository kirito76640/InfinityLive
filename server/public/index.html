<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:#bb07d3;

    color:white;

    font-family:Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}



.container{

    width:100%;

    max-width:430px;

    text-align:center;

}



.logo{

    width:220px;

    max-width:80%;

    margin-bottom:20px;

}



.card{

    background:rgba(0,0,0,0.75);

    border-radius:20px;

    padding:25px;

    box-shadow:0 0 25px rgba(0,0,0,0.5);

}



h1{

    margin-top:0;

}



input{

    width:100%;

    padding:15px;

    border-radius:10px;

    border:none;

    font-size:18px;

    margin-top:15px;

}



button{

    width:100%;

    margin-top:15px;

    padding:15px;

    border-radius:10px;

    border:none;

    font-size:20px;

    cursor:pointer;

    background:#ffffff;

    color:#000;

}



#status{

    margin-top:20px;

    font-size:20px;

}



#position{

    margin-top:10px;

    font-size:22px;

    font-weight:bold;

}



video{

    width:100%;

    margin-top:25px;

    border-radius:20px;

    background:black;

    display:none;

}


</style>


</head>


<body>



<div class="container">



<img
class="logo"
src="/images/logo.png"
alt="InfinityLive">





<div class="card">



<h1>
Bienvenue
</h1>



<p>
Entrez votre prénom pour participer
</p>




<input
id="name"
placeholder="Votre prénom">





<button id="join">

Participer

</button>




<div id="status"></div>


<div id="position"></div>



</div>





<video
id="camera"
autoplay
playsinline>
</video>





</div>







<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const button =
document.getElementById("join");


const nameInput =
document.getElementById("name");


const status =
document.getElementById("status");


const position =
document.getElementById("position");


const video =
document.getElementById("camera");



let joined = false;

let cameraStream = null;







// Mise à jour position file

socket.on(
"queuePosition",
(pos)=>{


    if(joined){


        position.innerText =
        "Position dans la file : " + pos;


    }


});







// Quand c'est son tour

socket.on(
"visitorCalled",
()=>{


    status.innerText =
    "🎉 C'est votre tour !";



    position.innerText = "";



    if(cameraStream){


        video.srcObject =
        cameraStream;



        video.style.display =
        "block";


    }


});








button.onclick =
async()=>{


    const name =
    nameInput.value.trim();




    if(!name){

        alert(
            "Veuillez entrer votre prénom"
        );

        return;

    }







    try{


        // Demande autorisation caméra

        cameraStream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        });







        // On rejoint la file

        socket.emit(
            "joinQueue",
            name
        );



        // Prépare WebRTC

        socket.emit(
            "visitorReady"
        );






        joined=true;




        button.style.display =
        "none";



        nameInput.style.display =
        "none";





        status.innerText =
        "✅ Vous êtes dans la file d'attente";



    }


    catch(error){


        console.error(error);



        status.innerText =
        "Autorisation caméra refusée";


    }


};





</script>


</body>

</html>
