<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:#000;

    color:white;

    font-family:Arial, sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}



.container{

    width:90%;

    max-width:450px;

}



h1{

    font-size:48px;

    margin-bottom:10px;

}



.subtitle{

    color:#aaa;

    font-size:20px;

    margin-bottom:40px;

}



input{

    width:100%;

    padding:18px;

    font-size:20px;

    border-radius:12px;

    border:none;

    outline:none;

    margin-bottom:20px;

    text-align:center;

}



button{

    width:100%;

    padding:18px;

    font-size:22px;

    font-weight:bold;

    border:none;

    border-radius:12px;

    background:white;

    color:black;

    cursor:pointer;

}



button:active{

    transform:scale(0.98);

}



#status{

    margin-top:30px;

    font-size:22px;

    color:#ddd;

}



video{

    margin-top:30px;

    width:100%;

    border-radius:20px;

    display:none;

}



.card{

    background:#111;

    padding:30px;

    border-radius:20px;

}



</style>


</head>



<body>


<div class="container">


<div class="card">


<h1>
InfinityLive
</h1>


<div class="subtitle">

Participez à l'expérience en direct

</div>



<input 
id="name"
placeholder="Votre prénom"
>



<button id="join">

Participer

</button>



<div id="status"></div>



<video 
id="camera"
autoplay
playsinline
></video>



</div>


</div>





<script src="/socket.io/socket.io.js"></script>



<script>


const socket = io();



const button =
document.getElementById("join");


const nameInput =
document.getElementById("name");


const status =
document.getElementById("status");


const video =
document.getElementById("camera");








socket.on(
"visitorCalled",
()=>{


    status.innerText =
    "🎉 C'est votre tour !";



});









button.onclick = async()=>{


    const name =
    nameInput.value.trim();



    if(!name){


        alert(
            "Veuillez entrer votre prénom"
        );


        return;


    }






    status.innerText =
    "Activation de la caméra...";






    try{


        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false

        });





        video.srcObject =
        stream;



        video.style.display =
        "block";





        socket.emit(
            "joinQueue",
            name
        );






        status.innerText =
        "✅ Vous êtes dans la file d'attente";





        button.style.display =
        "none";


        nameInput.style.display =
        "none";





    }

    catch(error){



        console.error(error);



        status.innerText =
        "Impossible d'accéder à la caméra";



    }



};



</script>



</body>

</html>
