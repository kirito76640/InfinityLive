<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:#000;

    color:white;

    font-family:Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}



.container{

    width:90%;

    max-width:450px;

}



.card{

    background:#111;

    padding:35px;

    border-radius:25px;

}





/* LOGO INFINITYLIVE */

.logo{

    width:180px;

    max-width:80%;

    margin-bottom:20px;

}





h1{

    font-size:42px;

    margin:10px 0;

}



.subtitle{

    color:#aaa;

    font-size:20px;

    margin-bottom:35px;

}



input{

    width:100%;

    padding:18px;

    font-size:20px;

    border-radius:12px;

    border:none;

    outline:none;

    margin-bottom:20px;

    text-align:center;

}



button{

    width:100%;

    padding:18px;

    font-size:22px;

    font-weight:bold;

    border:none;

    border-radius:12px;

    background:white;

    color:black;

    cursor:pointer;

}



button:active{

    transform:scale(0.98);

}



#status{

    margin-top:25px;

    font-size:22px;

    color:#ddd;

}



video{

    margin-top:30px;

    width:100%;

    border-radius:20px;

    display:none;

}



</style>


</head>



<body>



<div class="container">


<div class="card">



<!--
    TON LOGO INFINITYLIVE ICI

    Place ton image dans :
    server/public/images/logo.png

-->


<img 
class="logo"
src="C:\Users\infin\Downloads\logo infinity sans fond.png"
alt="InfinityLive"
>





<h1>
InfinityLive
</h1>



<div class="subtitle">

Participez à l'expérience en direct

</div>





<input 
id="name"
placeholder="Votre prénom"
>





<button id="join">

Participer

</button>





<div id="status"></div>





<video 
id="camera"
autoplay
playsinline
></video>





</div>


</div>






<script src="/socket.io/socket.io.js"></script>



<script>


const socket = io();



const button =
document.getElementById("join");


const nameInput =
document.getElementById("name");


const status =
document.getElementById("status");


const video =
document.getElementById("camera");









socket.on(
"visitorCalled",
()=>{


    status.innerText =
    "🎉 C'est votre tour !";


});









button.onclick = async()=>{


    const name =
    nameInput.value.trim();



    if(!name){


        alert(
            "Veuillez entrer votre prénom"
        );


        return;


    }






    status.innerText =
    "Activation de la caméra...";






    try{


        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:"user"

            },

            audio:false

        });





        video.srcObject =
        stream;




        video.style.display =
        "block";






        socket.emit(
            "joinQueue",
            name
        );







        status.innerText =
        "✅ Vous êtes dans la file d'attente";






        button.style.display =
        "none";


        nameInput.style.display =
        "none";





    }

    catch(error){


        console.error(error);



        status.innerText =
        "Impossible d'accéder à la caméra";



    }



};



</script>



</body>

</html>
