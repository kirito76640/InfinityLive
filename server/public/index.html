<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:#bb07d3;

    color:white;

    font-family:Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}



.container{

    width:100%;

    max-width:430px;

    text-align:center;

}



.logo{

    width:220px;

    max-width:80%;

    margin-bottom:20px;

}



.card{

    background:rgba(0,0,0,0.75);

    border-radius:20px;

    padding:25px;

    box-shadow:0 0 25px rgba(0,0,0,0.5);

}



h1{

    margin-top:0;

}



input{

    width:100%;

    padding:15px;

    border-radius:10px;

    border:none;

    font-size:18px;

    margin-top:15px;

}



button{

    width:100%;

    margin-top:15px;

    padding:15px;

    border-radius:10px;

    border:none;

    font-size:20px;

    cursor:pointer;

    background:#ffffff;

    color:#000;

}



#status{

    margin-top:20px;

    font-size:20px;

}



#position{

    margin-top:10px;

    font-size:22px;

    font-weight:bold;

}



video{

    width:100%;

    margin-top:25px;

    border-radius:20px;

    background:black;

    display:none;

}


</style>


</head>


<body>



<div class="container">



<img
class="logo"
src="/images/logo.png"
alt="InfinityLive">





<div class="card">



<h1>
Bienvenue
</h1>



<p>
Entrez votre prénom pour participer
</p>





<input
id="name"
placeholder="Votre prénom">





<button id="join">

Participer

</button>





<div id="status"></div>


<div id="position"></div>





<video
id="camera"
autoplay
playsinline>
</video>



</div>





<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const button =
document.getElementById("join");


const nameInput =
document.getElementById("name");


const status =
document.getElementById("status");


const position =
document.getElementById("position");


const video =
document.getElementById("camera");



let joined = false;


let cameraStream = null;


let peerConnection = null;





const rtcConfiguration = {

    iceServers:[

        {
            urls:
            "stun:stun.l.google.com:19302"
        }

    ]

};






// ----------------------
// POSITION FILE
// ----------------------


socket.on(
"queuePosition",
(pos)=>{


    if(joined){


        position.innerText =
        "Position dans la file : " + pos;


    }


});






// ----------------------
// TON TOUR
// ----------------------


socket.on(
"visitorCalled",
async()=>{


    console.log(
        "🎥 Début envoi caméra"
    );


    status.innerText =
    "🎉 C'est votre tour !";



    position.innerText = "";



    if(!cameraStream){


        console.log(
            "Aucun flux caméra"
        );


        return;


    }





    if(peerConnection){


        peerConnection.close();


        peerConnection = null;


    }



    peerConnection =
    new RTCPeerConnection(
        rtcConfiguration
    );





    cameraStream
    .getTracks()
    .forEach(track=>{


        peerConnection.addTrack(
            track,
            cameraStream
        );


    });





    peerConnection.onicecandidate =
    (event)=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };
    



    const offer =
    await peerConnection.createOffer();




    await peerConnection.setLocalDescription(
        offer
    );





    socket.emit(
        "offer",
        offer
    );



    console.log(
        "📤 OFFER envoyée au serveur"
    );



});











// ----------------------
// RECEPTION ANSWER
// ----------------------


socket.on(
"answer",
async(answer)=>{


    if(peerConnection){


        await peerConnection.setRemoteDescription(
            answer
        );


        console.log(
            "📥 ANSWER reçue"
        );


    }


});









// ----------------------
// RECEPTION ICE
// ----------------------


socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        try{


            await peerConnection.addIceCandidate(
                candidate
            );


            console.log(
                "🧊 ICE ajouté"
            );


        }
        catch(error){


            console.error(
                "Erreur ICE :",
                error
            );


        }


    }


});









// ----------------------
// BOUTON PARTICIPER
// ----------------------


button.onclick =
async()=>{


    const name =
    nameInput.value.trim();





    if(!name){


        alert(
            "Veuillez entrer votre prénom"
        );


        return;


    }






    try{


        cameraStream =
await navigator.mediaDevices.getUserMedia({

    video:{

        facingMode:"user",

        width:{
            ideal:1920
        },

        height:{
            ideal:1080
        },

        frameRate:{
            ideal:30,
            max:60
        },

        aspectRatio:{
            ideal:16/9
        }


    },

    audio:false

});

const videoTrack =
cameraStream.getVideoTracks()[0];


const capabilities =
videoTrack.getCapabilities();


if(capabilities.width){

    await videoTrack.applyConstraints({

        width:{
            ideal:1920
        },

        height:{
            ideal:1080
        }

    });

}




        console.log(
            "📷 Caméra activée"
        );






        // Identification WebRTC

        socket.emit(
            "visitorReady"
        );






        // Entrée file d'attente

        socket.emit(
            "joinQueue",
            name
        );







        joined = true;






        button.style.display =
        "none";



        nameInput.style.display =
        "none";






        status.innerText =
        "✅ Vous êtes dans la file d'attente";



    }


    catch(error){


        console.error(
            error
        );


        status.innerText =
        "Autorisation caméra refusée";


    }


};





</script>


</body>

</html>
