<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfinityLive Podium</title>
<link rel="stylesheet" href="/css/infinity.css">
<style>
body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.4vh;
    width:92%;
    height:94vh;
}
.logo{ height:22vh; animation:float 5s ease-in-out infinite; }
h1{
    margin:0;
    font-size:clamp(40px,6vw,104px);
    font-weight:800;
    line-height:1.08;
    letter-spacing:-.015em;
    padding-bottom:.08em;
    filter:drop-shadow(0 0 28px rgba(155,123,240,.5));
}
p{
    margin:0;
    font-size:clamp(22px,2.8vw,48px);
    font-weight:600;
    color:var(--muted);
}
.qr-ring{
    margin-top:1vh;
    padding:5px;
    border-radius:34px;
    background:var(--grad);
    box-shadow:0 0 70px rgba(155,123,240,.5);
    animation:glow 3s ease-in-out infinite;
}
.qr{
    width:min(34vh,420px);
    height:min(34vh,420px);
    padding:16px;
    border-radius:29px;
    background:#fff;
}
.qr img{ width:100%; height:100%; object-fit:contain; display:block; }
</style>
</head>
<body>

<div class="stage">
    <img class="logo" src="/images/logo.png?v=4" alt="InfinityLive">
    <h1 class="grad-text">Souriez, vous êtes filmé !</h1>
    <p>Passez sur nos écrans en scannant ce QR code</p>
    <div class="qr-ring">
        <div class="qr"><img src="/images/qr-code.png" alt="QR code InfinityLive"></div>
    </div>
</div>

</body>
</html>
