<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive - Administration</title>


<style>


*{
    box-sizing:border-box;
}



body{

    margin:0;

    min-height:100vh;

    background:
    radial-gradient(
        circle at top,
        #4b0082,
        #090909 60%
    );

    color:white;

    font-family:Arial, sans-serif;

}




header{

    padding:30px;

    text-align:center;

    font-size:32px;

    font-weight:bold;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.15);

}



main{

    max-width:1000px;

    margin:auto;

    padding:30px;

}




.controls{

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    margin-bottom:25px;

}



button{

    flex:1;

    min-width:220px;

    padding:16px;

    border:none;

    border-radius:15px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    transition:.3s;

}



button:hover{

    transform:scale(1.03);

}



.start{

    background:
    linear-gradient(
        135deg,
        #00c853,
        #009624
    );

}



.stop{

    background:
    linear-gradient(
        135deg,
        #ff1744,
        #b2102f
    );

}




#status{

    padding:18px;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    font-size:22px;

    margin-bottom:30px;

    text-align:center;

}




.dashboard{

    display:grid;

    grid-template-columns:

    repeat(
        auto-fit,
        minmax(250px,1fr)
    );

    gap:20px;

    margin-bottom:30px;

}





.card{

    background:

    rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border-radius:20px;

    padding:25px;

    border:

    1px solid rgba(255,255,255,.15);

    box-shadow:

    0 10px 30px rgba(0,0,0,.3);

}




.card-title{

    opacity:.7;

    font-size:16px;

    margin-bottom:10px;

}



.card-value{

    font-size:30px;

    font-weight:bold;

}





h2{

    margin-top:40px;

    padding-bottom:10px;

    border-bottom:

    1px solid rgba(255,255,255,.2);

}




#current{

    display:none;

}





.current-card{


    background:

    linear-gradient(
        135deg,
        #bb07d3,
        #6a0080
    );


    padding:25px;

    border-radius:20px;

    font-size:25px;

    text-align:center;


}





#queue{

    display:flex;

    flex-direction:column;

    gap:15px;

}






.visitor-card{


    background:

    rgba(255,255,255,.08);


    padding:20px;


    border-radius:15px;


    display:flex;


    justify-content:space-between;


    align-items:center;


}




.visitor-position{


    font-size:18px;


    opacity:.7;


}




.visitor-name{


    font-size:24px;


    font-weight:bold;


}




@media(max-width:600px){


    header{

        font-size:24px;

    }


    main{

        padding:15px;

    }


    button{

        min-width:100%;

    }


}

</style>


</head>


<body>


<header>

    InfinityLive - Administration

</header>




<main>




<div class="controls">


    <button
    class="start"
    onclick="startAuto()">

        🟢 START AUTOMATIQUE

    </button>




    <button
    class="stop"
    onclick="stopAuto()">

        🔴 STOP AUTOMATIQUE

    </button>


</div>






<div id="status">

    Automatique : ARRÊTÉ 🔴

</div>







<div class="dashboard">


    <div class="card">


        <div class="card-title">

            Participants en attente

        </div>


        <div
        class="card-value"
        id="counter">

            0

        </div>


    </div>




    <div class="card">


        <div class="card-title">

            Statut système

        </div>


        <div
        class="card-value">

            🟢 En ligne

        </div>


    </div>


</div>








<h2>

🎥 Visiteur en cours

</h2>



<div id="current">


</div>








<h2>

👥 File d'attente

</h2>




<div id="queue">


    <div class="card">

        Aucun visiteur.

    </div>


</div>






</main>








<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();




const queue =
document.getElementById("queue");



const status =
document.getElementById("status");



const current =
document.getElementById("current");



const counter =
document.getElementById("counter");




let autoActive = false;








function startAuto(){


    autoActive = true;


    status.innerText =

    "Automatique : ACTIF 🟢";



    socket.emit(
        "startAuto"
    );


}








function stopAuto(){


    autoActive = false;


    status.innerText =

    "Automatique : ARRÊTÉ 🔴";



    socket.emit(
        "stopAuto"
    );


}









socket.on(
"currentVisitor",
(user)=>{


    if(user){



        current.style.display =
        "block";



        current.className =
        "current-card";



        current.innerHTML =


        "🎥 En passage : <b>"
        +
        user.name
        +
        "</b>";



    }
    else{


        current.style.display =
        "none";


    }


});









socket.on(
"queueUpdated",
(users)=>{


    queue.innerHTML = "";



    counter.innerText =
    users.length;





    if(users.length === 0){


        queue.innerHTML =

        `
        <div class="card">

        Aucun visiteur.

        </div>
        `;


        return;


    }








    users.forEach((user,index)=>{


        const div =
        document.createElement("div");



        div.className =
        "visitor-card";




        div.innerHTML =


        `

        <div>


            <div class="visitor-position">

            Position ${index+1}

            </div>



            <div class="visitor-name">

            👤 ${user.name}

            </div>


        </div>



        <div>


            ${autoActive
            ?
            "🟢 Auto"
            :
            "⏳ Attente"
            }


        </div>


        `;



        queue.appendChild(div);



    });



});





</script>



</body>

</html>
