<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive - Admin</title>


<style>

body{

    margin:0;

    background:#111;

    color:white;

    font-family:Arial;

}


header{

    background:#1f1f1f;

    padding:20px;

    font-size:28px;

    text-align:center;

}



main{

    max-width:900px;

    margin:auto;

    padding:30px;

}



h2{

    border-bottom:1px solid #444;

    padding-bottom:10px;

}



#current{

    margin-top:20px;

    background:#0d5;

    color:black;

    padding:15px;

    border-radius:10px;

    display:none;

    font-size:20px;

}



#queue{

    margin-top:20px;

}



.user{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#222;

    margin-bottom:10px;

    padding:15px;

    border-radius:10px;

}



button{

    padding:10px 20px;

    cursor:pointer;

}



button:disabled{

    cursor:not-allowed;

    opacity:0.5;

}



</style>

</head>


<body>


<header>
InfinityLive - Administration
</header>



<main>


<h2>
Visiteur en cours
</h2>


<div id="current">

</div>



<h2>
File d'attente
</h2>


<div id="queue">
Aucun visiteur.
</div>



</main>






<script src="/socket.io/socket.io.js"></script>



<script>


const socket = io();


const queue = document.getElementById("queue");


const current = document.getElementById("current");



let visitorInProgress = false;







socket.on(
"currentVisitor",
(user)=>{


    if(user){


        visitorInProgress = true;


        current.style.display="block";


        current.innerHTML =
        "🎥 En passage : <b>"
        + user.name
        +"</b>";



    }

    else{


        visitorInProgress=false;


        current.style.display="none";


    }


});







socket.on(
"queueUpdated",
(users)=>{


    queue.innerHTML="";



    if(users.length===0){


        queue.innerHTML =
        "Aucun visiteur.";


        return;


    }







    users.forEach((user,index)=>{



        const div =
        document.createElement("div");



        div.className="user";





        if(index===0 && !visitorInProgress){


            div.innerHTML=`

            <span>
            ${index+1}. ${user.name}
            </span>


            <button onclick="callUser('${user.id}')">
            Faire passer
            </button>

            `;


        }

        else{


            div.innerHTML=`

            <span>
            ${index+1}. ${user.name}
            </span>


            <button disabled>
            ${visitorInProgress 
            ? "Passage en cours"
            : "En attente..."}
            </button>

            `;


        }





        queue.appendChild(div);



    });



});







function callUser(id){


    if(visitorInProgress)
        return;



    socket.emit(
        "callVisitor",
        id
    );


}





</script>


</body>

</html>
