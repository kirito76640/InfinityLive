<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive - Admin</title>


<style>

body{

    margin:0;
    background:#111;
    color:white;
    font-family:Arial;

}



header{

    background:#1f1f1f;
    padding:20px;
    font-size:28px;
    text-align:center;

}



main{

    max-width:900px;
    margin:auto;
    padding:30px;

}



h2{

    border-bottom:1px solid #444;
    padding-bottom:10px;

}



.controls{

    display:flex;
    gap:15px;
    margin-bottom:20px;

}



button{

    padding:12px 25px;
    cursor:pointer;
    font-size:16px;

}



#status{

    margin-top:15px;
    font-size:20px;

}



#current{

    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#222;
    display:none;

}



#queue{

    margin-top:20px;

}



.user{

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#222;
    margin-bottom:10px;
    padding:15px;
    border-radius:10px;

}



button:disabled{

    opacity:0.5;
    cursor:not-allowed;

}



</style>


</head>


<body>



<header>
InfinityLive - Administration
</header>





<main>



<div class="controls">

<button onclick="startAuto()">
🟢 START AUTOMATIQUE
</button>


<button onclick="stopAuto()">
🔴 STOP AUTOMATIQUE
</button>


</div>




<div id="status">

Automatique : ARRÊTÉ

</div>




<h2>
Visiteur en cours
</h2>


<div id="current">

</div>





<h2>
File d'attente
</h2>



<div id="queue">

Aucun visiteur.

</div>




</main>







<script src="/socket.io/socket.io.js"></script>



<script>



const socket = io();



const queue =
document.getElementById("queue");


const status =
document.getElementById("status");


const current =
document.getElementById("current");



let autoActive=false;






function startAuto(){


    autoActive=true;


    status.innerText =
    "Automatique : ACTIF 🟢";


    socket.emit(
        "startAuto"
    );


}





function stopAuto(){


    autoActive=false;


    status.innerText =
    "Automatique : ARRÊTÉ 🔴";


    socket.emit(
        "stopAuto"
    );


}







socket.on(
"currentVisitor",
(user)=>{


    if(user){


        current.style.display =
        "block";


        current.innerHTML =
        "🎥 En passage : <b>"
        + user.name
        +"</b>";



    }
    else{


        current.style.display =
        "none";


    }


});







socket.on(
"queueUpdated",
(users)=>{


    queue.innerHTML="";



    if(users.length===0){


        queue.innerHTML =
        "Aucun visiteur.";


        return;

    }





    users.forEach((user,index)=>{



        const div =
        document.createElement("div");



        div.className="user";




        div.innerHTML = `

        <span>
        ${index+1}. ${user.name}
        </span>


        <button disabled>

        ${autoActive
        ? "Automatique"
        : "En attente"}

        </button>

        `;




        queue.appendChild(div);



    });



});






</script>



</body>

</html>
