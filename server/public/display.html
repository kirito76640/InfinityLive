<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive Display</title>


<style>

*{
    box-sizing:border-box;
}


body {

    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;

    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

}



#message {

    position:absolute;

    width:90%;

    font-size:70px;

    font-weight:bold;

    color:white;

    z-index:5;

}



video {

    display:none;

    width:100vw;

    height:100vh;

    object-fit:contain;

    background:black;

}



</style>


</head>


<body>


<div id="message"></div>


<video
id="remoteVideo"
autoplay
playsinline>
</video>





<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const message =
document.getElementById("message");



const remoteVideo =
document.getElementById("remoteVideo");



let peerConnection = null;


let currentUser = null;





const configuration = {


    iceServers:[


        {


            urls:
            "stun:stun.l.google.com:19302"


        }


    ]


};






// ----------------------
// DISPLAY PRET
// ----------------------


socket.emit(
    "displayReady"
);









function showMessage(text,duration){


    return new Promise(resolve=>{


        message.innerText =
        text;


        message.style.display =
        "block";



        remoteVideo.style.display =
        "none";



        setTimeout(()=>{


            resolve();


        },duration);



    });


}









// ----------------------
// CHANGEMENT VISITEUR
// ----------------------


socket.on(
"currentVisitor",
async(user)=>{


    if(user){


        currentUser = user;



        message.style.display =
        "none";


    }
    else{


        remoteVideo.srcObject =
        null;



        remoteVideo.style.display =
        "none";



        if(peerConnection){


            peerConnection.close();


            peerConnection = null;


        }





        if(currentUser){


            await showMessage(

                "Infinity te remercie " + currentUser.name + " !",

                2000

            );


        }






        await showMessage(

            "Au suivant !",

            2000

        );



        currentUser = null;



    }


});








// ----------------------
// RECEPTION OFFER
// ----------------------


socket.on(
"offer",
async(offer)=>{


    console.log(
        "📥 OFFER reçue"
    );



    if(peerConnection){


        peerConnection.close();


        peerConnection = null;


    }





    peerConnection =
    new RTCPeerConnection(
        configuration
    );





    peerConnection.onicecandidate =
    (event)=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };
    




    peerConnection.ontrack =
    (event)=>{


        console.log(
            "🎥 Flux vidéo reçu"
        );



        remoteVideo.srcObject =
        event.streams[0];



        remoteVideo.style.display =
        "block";



        message.style.display =
        "none";



    };






    await peerConnection.setRemoteDescription(
        offer
    );



    console.log(
        "✅ OFFER enregistrée"
    );






    const answer =
    await peerConnection.createAnswer();





    await peerConnection.setLocalDescription(
        answer
    );





    socket.emit(
        "answer",
        answer
    );



    console.log(
        "📤 ANSWER envoyée"
    );



});












// ----------------------
// RECEPTION ICE
// ----------------------


socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        try{


            await peerConnection.addIceCandidate(
                candidate
            );


            console.log(
                "🧊 ICE ajouté"
            );


        }
        catch(error){


            console.error(
                "Erreur ICE :",
                error
            );


        }


    }


});





</script>


</body>

</html>
