<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive Display</title>


<style>

*{
    box-sizing:border-box;
}


body {

    margin:0;

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:black;

    color:white;

    font-family:Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}


#logoInfinity{

    position:absolute;

    top:30px;

    left:50%;

    transform:translateX(-50%);

    width:200px;

    z-index:10;

}



#message {

    position:absolute;

    width:90%;

    font-size:clamp(
        40px,
        6vw,
        90px
    );

    font-weight:900;

    letter-spacing:2px;

    color:white;

    z-index:5;

    text-shadow:

    0 0 15px #bb07d3,

    0 0 30px #bb07d3;

}



video {

    display:none;

    position:absolute;

    top:260px;

    left:50%;

    transform:translateX(-50%);


    width:90vw;

    max-width:1200px;


    height:calc(100vh - 300px);


    object-fit:contain;


    background:black;


    border-radius:25px;


    box-shadow:

    0 0 40px rgba(187,7,211,.5);

}


</style>

</head>


<body>


<img
id="logoInfinity"
src="/images/logo.png"
alt="InfinityLive">



<div id="message"></div>


<video
id="remoteVideo"
autoplay
playsinline>
</video>



<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const message =
document.getElementById("message");


const remoteVideo =
document.getElementById("remoteVideo");



let peerConnection = null;


let currentUser = null;


let passageTimer = null;



const configuration = {

    iceServers:[

        {

            urls:
            "stun:stun.l.google.com:19302"

        }

    ]

};




// DISPLAY CONNECTE

socket.emit(
    "displayReady"
);





function showMessage(text,duration){


    return new Promise(resolve=>{


        message.innerText = text;


        message.style.display = "block";


        remoteVideo.style.display = "none";


        setTimeout(()=>{


            resolve();


        },duration);


    });


}






async function finishVisitor(){



    if(passageTimer){


        clearTimeout(passageTimer);


        passageTimer = null;


    }




    remoteVideo.srcObject = null;


    remoteVideo.style.display = "none";




    if(peerConnection){


        peerConnection.close();


        peerConnection = null;


    }




    if(currentUser){


        await showMessage(

            "Infinity te remercie " + currentUser.name + " !",

            2000

        );


    }




    await showMessage(

        "Au suivant !",

        2000

    );




    currentUser = null;




    socket.emit(
        "displayReadyForNext"
    );


}







// NOUVEAU VISITEUR


socket.on(
"currentVisitor",
(user)=>{


    if(user){


        currentUser = user;


        message.style.display =
        "none";


    }


});








// RECEPTION OFFER


socket.on(
"offer",
async(offer)=>{


    if(peerConnection){


        peerConnection.close();


    }




    peerConnection =
    new RTCPeerConnection(
        configuration
    );





    peerConnection.onicecandidate =
    (event)=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };






    peerConnection.ontrack =
    (event)=>{


        console.log(
            "🎥 Caméra reçue"
        );



        remoteVideo.srcObject =
        event.streams[0];



        remoteVideo.style.display =
        "block";


        message.style.display =
        "none";



        // LANCEMENT DES 10 SECONDES


        passageTimer = setTimeout(()=>{


            finishVisitor();


        },20000);



    };







    await peerConnection.setRemoteDescription(
        offer
    );




    const answer =
    await peerConnection.createAnswer();



    await peerConnection.setLocalDescription(
        answer
    );




    socket.emit(
        "answer",
        answer
    );


});









socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        try{


            await peerConnection.addIceCandidate(
                candidate
            );


        }
        catch(error){


            console.error(
                error
            );


        }


    }


});



</script>


</body>

</html>
