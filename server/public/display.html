<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive Display</title>


<style>


*{
    box-sizing:border-box;
}



body {

    margin:0;

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:black;

    color:white;

    font-family:Arial,sans-serif;


    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}




#logoInfinity{

    position:absolute;

    top:30px;

    left:50%;

    transform:translateX(-50%);

    width:200px;

    z-index:10;

    opacity:1;

}





#message {

    position:absolute;

    width:90%;


    font-size:clamp(
        40px,
        6vw,
        90px
    );


    font-weight:900;


    letter-spacing:2px;


    color:white;


    z-index:5;



    text-shadow:

    0 0 15px #bb07d3,

    0 0 30px #bb07d3;



    animation:

    appear .5s ease;


}






@keyframes appear{


    from{

        opacity:0;

        transform:
        scale(.8);

    }


    to{

        opacity:1;

        transform:
        scale(1);

    }


}





video {

    display:none;

    position:absolute;

    top:260px;

    left:50%;

    transform:translateX(-50%);


    width:90vw;

    max-width:1200px;


    height:calc(100vh - 300px);


    object-fit:contain;


    background:black;


    border-radius:25px;


    image-rendering:auto;


    box-shadow:

    0 0 40px rgba(187,7,211,.5);

}
#remoteVideo{

    filter:

    contrast(1.05)

    brightness(1.05);


}






#remoteVideo{


    animation:

    videoAppear .8s ease;


}





@keyframes videoAppear{


    from{


        opacity:0;


    }


    to{


        opacity:1;


    }


}




</style>


</head>


<body>


<img
id="logoInfinity"
src="/images/logo.png"
alt="InfinityLive">



<div id="message"></div>


<video
id="remoteVideo"
autoplay
playsinline>
</video>




<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const message =
document.getElementById("message");



const remoteVideo =
document.getElementById("remoteVideo");



let peerConnection = null;


let currentUser = null;






const configuration = {


    iceServers:[


        {


            urls:
            "stun:stun.l.google.com:19302"


        }


    ]


};






// ----------------------
// DISPLAY PRET
// ----------------------


socket.emit(
    "displayReady"
);









function showMessage(text,duration){


    return new Promise(resolve=>{


        message.innerText =
        text;


        message.style.display =
        "block";



        remoteVideo.style.display =
        "none";



        setTimeout(()=>{


            resolve();


        },duration);



    });


}









// ----------------------
// CHANGEMENT VISITEUR
// ----------------------


socket.on(
"currentVisitor",
async(user)=>{


    if(user){


        currentUser = user;



        message.style.display =
        "none";


    }
    else{


        remoteVideo.srcObject =
        null;



        remoteVideo.style.display =
        "none";



        if(peerConnection){


            peerConnection.close();


            peerConnection = null;


        }





        if(currentUser){


            await showMessage(

                "Infinity te remercie " + currentUser.name + " !",

                2000

            );


        }






        await showMessage(

            "Au suivant !",

            2000

        );



        currentUser = null;



    }


});








// ----------------------
// RECEPTION OFFER
// ----------------------


socket.on(
"offer",
async(offer)=>{


    console.log(
        "📥 OFFER reçue"
    );



    if(peerConnection){


        peerConnection.close();


        peerConnection = null;


    }





    peerConnection =
    new RTCPeerConnection(
        configuration
    );





    peerConnection.onicecandidate =
    (event)=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };






    peerConnection.ontrack =
    (event)=>{


        console.log(
            "🎥 Flux vidéo reçu"
        );



        remoteVideo.srcObject =
        event.streams[0];



        remoteVideo.style.display =
        "block";



        message.style.display =
        "none";



    };






    await peerConnection.setRemoteDescription(
        offer
    );



    console.log(
        "✅ OFFER enregistrée"
    );







    const answer =
    await peerConnection.createAnswer();





    await peerConnection.setLocalDescription(
        answer
    );





    socket.emit(
        "answer",
        answer
    );



    console.log(
        "📤 ANSWER envoyée"
    );



});











// ----------------------
// RECEPTION ICE
// ----------------------


socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        try{


            await peerConnection.addIceCandidate(
                candidate
            );


            console.log(
                "🧊 ICE ajouté"
            );


        }
        catch(error){


            console.error(
                "Erreur ICE :",
                error
            );


        }


    }


});






</script>


</body>

</html>
