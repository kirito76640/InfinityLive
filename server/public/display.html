<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive Display</title>


<style>

*{
    box-sizing:border-box;
}


body {

    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;

    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

}



#message {

    position:absolute;

    width:90%;

    font-size:70px;

    font-weight:bold;

    color:white;

    z-index:5;

}



video {

    display:none;

    width:100vw;

    height:100vh;

    object-fit:contain;

    background:black;

}



</style>


</head>


<body>


<div id="message"></div>


<video id="remoteVideo" autoplay playsinline></video>




<script src="/socket.io/socket.io.js"></script>



<script>


const socket = io();



const message =
document.getElementById("message");


const remoteVideo =
document.getElementById("remoteVideo");



let peerConnection = null;



const configuration = {


    iceServers:[

        {
            urls:
            "stun:stun.l.google.com:19302"
        }

    ]


};





socket.emit(
    "displayReady"
);






function showMessage(text,duration){


    return new Promise(resolve=>{


        message.innerText = text;


        message.style.display="block";


        remoteVideo.style.display="none";



        setTimeout(()=>{


            resolve();


        },duration);



    });


}







async function welcomeVisitor(user){



    await showMessage(

        "Infinity te souhaite la bienvenue " + user.name,

        10000

    );



}









socket.on(
"currentVisitor",
async(user)=>{



    if(user){


        await welcomeVisitor(user);



    }
    else{


        await showMessage(

            "Infinity te remercie !",

            2000

        );



        await showMessage(

            "Au suivant !",

            2000

        );



    }



});









socket.on(
"offer",
async(offer)=>{



    peerConnection =
    new RTCPeerConnection(
        configuration
    );





    peerConnection.onicecandidate =
    event=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };






    peerConnection.ontrack =
    event=>{


        remoteVideo.srcObject =
        event.streams[0];



        remoteVideo.style.display =
        "block";



        message.style.display =
        "none";



    };







    await peerConnection.setRemoteDescription(
        offer
    );





    const answer =
    await peerConnection.createAnswer();



    await peerConnection.setLocalDescription(
        answer
    );




    socket.emit(
        "answer",
        answer
    );



});








socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        await peerConnection.addIceCandidate(
            candidate
        );


    }


});



</script>


</body>

</html>
