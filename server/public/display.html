<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive Display</title>


<style>

*{
    box-sizing:border-box;
}


body {

    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;

    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

}




#status {

    position:absolute;

    font-size:70px;

    color:#777;

    z-index:2;

}





#visitor {

    position:absolute;

    top:40px;

    left:50%;

    transform:translateX(-50%);

    font-size:80px;

    font-weight:bold;

    z-index:3;

    text-shadow:0 0 20px black;

}





video {

    display:none;

    width:100vw;

    height:100vh;

    object-fit:contain;

    background:black;

}





</style>


</head>


<body>



<div id="status">
En attente
</div>



<div id="visitor"></div>



<video id="remoteVideo" autoplay playsinline></video>






<script src="/socket.io/socket.io.js"></script>



<script>



const socket = io();



const status =
document.getElementById("status");


const visitor =
document.getElementById("visitor");


const remoteVideo =
document.getElementById("remoteVideo");



let peerConnection;



const configuration = {


    iceServers:[

        {

            urls:
            "stun:stun.l.google.com:19302"

        }

    ]


};





socket.emit(
    "displayReady"
);








socket.on(
"currentVisitor",
(user)=>{


    if(user){


        visitor.style.display="block";


        visitor.innerText =
        user.name;



    }

    else{


        visitor.style.display="none";


        remoteVideo.style.display="none";


        status.style.display="block";


        status.innerText =
        "En attente";



    }


});









socket.on(
"offer",
async(offer)=>{


    peerConnection =
    new RTCPeerConnection(
        configuration
    );





    peerConnection.onicecandidate =
    event=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };






    peerConnection.ontrack =
    event=>{


        remoteVideo.srcObject =
        event.streams[0];



        remoteVideo.style.display =
        "block";



        status.style.display =
        "none";



    };






    await peerConnection.setRemoteDescription(
        offer
    );





    const answer =
    await peerConnection.createAnswer();




    await peerConnection.setLocalDescription(
        answer
    );




    socket.emit(
        "answer",
        answer
    );



});









socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        await peerConnection.addIceCandidate(
            candidate
        );


    }


});





</script>


</body>

</html>
