<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive Display</title>


<style>

*{
    box-sizing:border-box;
}



body {

    margin:0;

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:
    radial-gradient(
        circle at center,
        #3a0055,
        #050505 70%
    );

    color:white;

    font-family:
    Arial,
    sans-serif;


    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}




body::before{

    content:"";

    position:absolute;

    width:100%;

    height:100%;

    background:
    radial-gradient(
        circle,
        rgba(187,7,211,0.25),
        transparent 60%
    );


    animation:
    pulse 5s infinite;


}





@keyframes pulse{


    0%{

        opacity:.4;

    }


    50%{

        opacity:.8;

    }


    100%{

        opacity:.4;

    }


}







#message {


    position:absolute;

    width:90%;


    font-size:clamp(
        40px,
        6vw,
        90px
    );


    font-weight:900;


    letter-spacing:2px;


    color:white;


    z-index:5;



    text-shadow:

    0 0 15px #bb07d3,
    0 0 30px #bb07d3;



    animation:

    appear .5s ease;


}






@keyframes appear{


    from{

        opacity:0;

        transform:
        scale(.8);

    }


    to{

        opacity:1;

        transform:
        scale(1);

    }


}






video {


    display:none;


    width:100vw;


    height:100vh;


    object-fit:contain;


    background:black;



}






#remoteVideo{

    animation:

    videoAppear .8s ease;


}





@keyframes videoAppear{


    from{


        opacity:0;


    }


    to{


        opacity:1;


    }


}





</style>


</head>


<body>


<div id="message"></div>


<video
id="remoteVideo"
autoplay
playsinline>
</video>





<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const message =
document.getElementById("message");



const remoteVideo =
document.getElementById("remoteVideo");



let peerConnection = null;


let currentUser = null;





const configuration = {


    iceServers:[


        {


            urls:
            "stun:stun.l.google.com:19302"


        }


    ]


};






// ----------------------
// DISPLAY PRET
// ----------------------


socket.emit(
    "displayReady"
);









function showMessage(text,duration){


    return new Promise(resolve=>{


        message.innerText =
        text;


        message.style.display =
        "block";



        remoteVideo.style.display =
        "none";



        setTimeout(()=>{


            resolve();


        },duration);



    });


}









// ----------------------
// CHANGEMENT VISITEUR
// ----------------------


socket.on(
"currentVisitor",
async(user)=>{


    if(user){


        currentUser = user;



        message.style.display =
        "none";


    }
    else{


        remoteVideo.srcObject =
        null;



        remoteVideo.style.display =
        "none";



        if(peerConnection){


            peerConnection.close();


            peerConnection = null;


        }





        if(currentUser){


            await showMessage(

                "Infinity te remercie " + currentUser.name + " !",

                2000

            );


        }






        await showMessage(

            "Au suivant !",

            2000

        );



        currentUser = null;



    }


});








// ----------------------
// RECEPTION OFFER
// ----------------------


socket.on(
"offer",
async(offer)=>{


    console.log(
        "📥 OFFER reçue"
    );



    if(peerConnection){


        peerConnection.close();


        peerConnection = null;


    }





    peerConnection =
    new RTCPeerConnection(
        configuration
    );





    peerConnection.onicecandidate =
    (event)=>{


        if(event.candidate){


            socket.emit(
                "iceCandidate",
                event.candidate
            );


        }


    };
    




    peerConnection.ontrack =
    (event)=>{


        console.log(
            "🎥 Flux vidéo reçu"
        );



        remoteVideo.srcObject =
        event.streams[0];



        remoteVideo.style.display =
        "block";



        message.style.display =
        "none";



    };






    await peerConnection.setRemoteDescription(
        offer
    );



    console.log(
        "✅ OFFER enregistrée"
    );






    const answer =
    await peerConnection.createAnswer();





    await peerConnection.setLocalDescription(
        answer
    );





    socket.emit(
        "answer",
        answer
    );



    console.log(
        "📤 ANSWER envoyée"
    );



});












// ----------------------
// RECEPTION ICE
// ----------------------


socket.on(
"iceCandidate",
async(candidate)=>{


    if(peerConnection){


        try{


            await peerConnection.addIceCandidate(
                candidate
            );


            console.log(
                "🧊 ICE ajouté"
            );


        }
        catch(error){


            console.error(
                "Erreur ICE :",
                error
            );


        }


    }


});





</script>


</body>

</html>
