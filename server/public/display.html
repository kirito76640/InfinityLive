<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive - Display</title>


<style>

body{

    margin:0;
    height:100vh;

    background:#000;

    color:white;

    font-family:Arial, sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}


#screen{

    font-size:60px;

    font-weight:bold;

}



.waiting{

    color:#777;

}


.live{

    color:white;

}


</style>


</head>


<body>


<div id="screen" class="waiting">

En attente...

</div>




<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();


const screen =
document.getElementById("screen");





socket.on("connect",()=>{


    console.log(
        "Display connecté :",
        socket.id
    );


});







socket.on("queueUpdated",(users)=>{



    if(users.length === 0){


        screen.className =
        "waiting";


        screen.innerHTML =
        "En attente...";


        return;


    }





    const current =
    users.find(
        user => user.status === "called"
    );





    if(current){



        screen.className =
        "live";



        screen.innerHTML =

        "🎥<br>"
        +
        current.name
        +
        "<br><br>"
        +
        "EN DIRECT";



    }



});




</script>


</body>

</html>
