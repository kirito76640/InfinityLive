<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InfinityLive Display</title>


<style>

body {

    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    text-align:center;

}



#status {

    font-size:80px;
    color:#777;

}



#visitor {

    display:none;

    font-size:120px;
    font-weight:bold;

}


</style>


</head>


<body>


<div id="status">
    En attente
</div>


<div id="visitor">

</div>



<script src="/socket.io/socket.io.js"></script>


<script>


const socket = io();



const status = document.getElementById("status");

const visitor = document.getElementById("visitor");





socket.on(
    "currentVisitor",
    (user)=>{


        if(user){


            status.style.display = "none";


            visitor.style.display = "block";


            visitor.innerText =
            user.name;



        }
        else{


            visitor.style.display = "none";


            status.style.display = "block";


            status.innerText =
            "En attente";


        }


    }

);





</script>


</body>

</html>
